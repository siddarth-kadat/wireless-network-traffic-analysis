# A generic, single database configuration for Alembic migrations.

[alembic]
# Path to migration scripts (relative to alembic.ini location)
script_location = %(here)s/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path prepends
prepend_sys_path = . ..

# Timezone to use when rendering dates (omit or comment out for local time)
# timezone =

# Truncate slug length
truncate_slug_length = 40

# Run environment during revision command
revision_environment = false

# Allow sourceless migrations
sourceless = false

# Version location specification
version_locations = %(here)s/migrations/versions

# Path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database URL is left empty here to prevent hardcoding credentials in repository files.
# Connection URL is dynamically loaded via backend.src.database.connection.get_database_url() in env.py.
sqlalchemy.url =

[post_write_hooks]
# Post-write hooks for revision scripts

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
